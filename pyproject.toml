[project]
name = "nanovla"
version = "0.1.0"
description = "A small vision-language-action model for the Unitree G1 + Dex3 dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers>=4.53,<5",
    "av>=14",
    "pyarrow>=18",
    "numpy>=1.26",
    "tensorboard>=2.17",
    "tqdm",
    # rajat_gradcam_analysis.py
    "matplotlib",
    "pandas",
    "scipy",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanovla"]
